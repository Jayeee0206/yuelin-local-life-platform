<!DOCTYPE html>
<html lang="zh-CN"><head><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f26a3d"><title>个人中心 · 悦邻生活</title><link rel="stylesheet" href="./css/element.css?v=20260922-3"><link rel="stylesheet" href="./css/main.css?v=20260922-3"><link rel="stylesheet" href="./css/info.css?v=20260922-3"><link rel="stylesheet" href="./css/theme.css?v=20260922-3"></head>
<body class="page-info"><div id="app">
<header class="header"><button class="header-back-btn" type="button" @click="goBack" aria-label="返回"><i class="el-icon-arrow-left"></i></button><h1 class="header-title">个人中心</h1><span class="header-spacer" aria-hidden="true"></span></header>
<p style="text-align:right;padding:8px 20px"><a href="/moderation.html">举报审核（管理员）</a></p><section class="basic"><div class="basic-icon"><img :src="user.icon || '/imgs/icons/default-icon.svg'" :alt="user.nickName || '用户头像'"></div><div class="basic-info"><div class="name">{{user.nickName}}</div><span>{{info.city || '未设置城市'}}</span><button class="edit-btn" type="button" @click="toEdit">编辑资料</button></div><button class="logout-btn" type="button" @click="logout" :disabled="loggingOut">{{loggingOut?'退出中...':'退出登录'}}</button></section>
<button class="introduce" type="button" @click="toEdit"><span v-if="info.introduce">{{info.introduce}}</span><span v-else>添加个人简介，让邻里更好地认识你 <i class="el-icon-edit"></i></span></button>
<section class="content"><el-tabs v-model="activeName" @tab-click="handleClick">
<el-tab-pane label="我的笔记" name="1"><div class="empty-profile-list" v-if="!blogs.length">还没有发布笔记，点击底部加号分享第一条生活灵感吧。</div><button v-for="blog in blogs" :key="blog.id" type="button" class="blog-item" @click="toBlogDetail(blog)"><span class="blog-img"><img :src="firstImage(blog.images)" :alt="blog.title"></span><span class="blog-info"><strong class="blog-title">{{blog.title}}</strong><span class="blog-liked">♥ {{blog.liked || 0}}</span></span></button></el-tab-pane>
<el-tab-pane label="关注动态" name="4"><div class="blog-list" @scroll="onScroll"><div class="empty-profile-list" v-if="!loadingFollow && !blogs2.length">暂时没有关注动态，去邻里分享详情页关注感兴趣的人吧。</div><article class="blog-box" v-for="blog in blogs2" :key="blog.id"><button class="blog-img2" type="button" @click="toBlogDetail(blog)"><img :src="blog.img" :alt="blog.title"></button><button class="blog-title" type="button" @click="toBlogDetail(blog)">{{blog.title}}</button><div class="blog-foot"><span class="blog-user-icon"><img :src="blog.icon || '/imgs/icons/default-icon.svg'" alt=""></span><span class="blog-user-name">{{blog.name}}</span><button type="button" class="blog-liked" @click="addLike(blog)">♥ {{blog.liked || 0}}</button></div></article><div class="shop-loading" v-if="loadingFollow">正在加载关注动态...</div><div class="shop-loading" v-if="followNoMore && blogs2.length">已经看到全部动态</div></div></el-tab-pane>
</el-tabs></section><foot-bar :active-btn="4"></foot-bar></div>
<script src="./js/vue.js?v=20260922-3"></script><script src="./js/axios.min.js?v=20260922-3"></script><script src="./js/element.js?v=20260922-3"></script><script src="./js/common.js?v=20260922-3"></script><script src="./js/footer.js?v=20260922-3"></script>
<script>
new Vue({el:'#app',data:{user:{},activeName:'1',info:{},blogs:[],blogs2:[],params:{minTime:0,offset:0},loadingFollow:false,followNoMore:false,loggingOut:false},created(){this.activeName=util.getUrlParam('tab')==='follow'?'4':'1';this.queryUser();},methods:{
firstImage(images){return(images||'').split(',')[0]||'/imgs/blogs/placeholder.svg';},
queryBlogs(){axios.get('/blog/of/me').then(({data})=>{this.blogs=data||[];}).catch(err=>this.$message.error(util.errorMessage(err)));},
queryBlogsOfFollow(clear){if(this.loadingFollow||(!clear&&this.followNoMore))return;if(clear){this.params={offset:0,minTime:Date.now()+1};this.followNoMore=false;}this.loadingFollow=true;axios.get('/blog/of/follow',{params:{offset:this.params.offset,lastId:this.params.minTime||Date.now()+1}}).then(({data})=>{data=data||{};const list=(data.list||[]).map(blog=>{blog.img=this.firstImage(blog.images);return blog;});this.blogs2=clear?list:this.blogs2.concat(list);this.params={minTime:data.minTime||this.params.minTime,offset:data.offset||0};if(!list.length)this.followNoMore=true;}).catch(err=>this.$message.error(util.errorMessage(err))).finally(()=>{this.loadingFollow=false;});},
queryUser(){axios.get('/user/me').then(({data})=>{this.user=data||{};this.queryUserInfo();this.queryBlogs();if(this.activeName==='4')this.queryBlogsOfFollow(true);}).catch(()=>{location.href='/login.html?redirect='+encodeURIComponent(location.pathname+location.search);});},
goBack(){history.length>1?history.back():location.href='/';},
queryUserInfo(){axios.get('/user/info/'+this.user.id).then(({data})=>{this.info=data||{};}).catch(err=>this.$message.error(util.errorMessage(err)));},
toBlogDetail(blog){location.href='/blog-detail.html?id='+encodeURIComponent(blog.id);},toEdit(){location.href='/info-edit.html';},
logout(){if(this.loggingOut)return;this.loggingOut=true;axios.post('/user/logout').catch(()=>{}).finally(()=>{sessionStorage.removeItem('token');location.href='/';});},
handleClick(tab){if(tab.name==='4')this.queryBlogsOfFollow(true);},
addLike(blog){axios.put('/blog/like/'+blog.id).then(()=>this.queryBlogById(blog)).catch(err=>this.$message.error(util.errorMessage(err)));},
queryBlogById(blog){axios.get('/blog/'+blog.id).then(({data})=>{blog.liked=data.liked;blog.isLike=data.isLike;}).catch(err=>this.$message.error(util.errorMessage(err)));},
onScroll(event){const el=event.target;if(el.scrollTop===0)this.queryBlogsOfFollow(true);else if(el.scrollTop+el.offsetHeight+24>=el.scrollHeight)this.queryBlogsOfFollow(false);}
}});
</script></body></html>
