services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: yuelin_local_life
      MYSQL_USER: ${DB_USERNAME:-yuelin}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/yuelin_local_life.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-yuelin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Shanghai
      DB_URL: jdbc:mysql://mysql:3306/yuelin_local_life?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia%2FShanghai&characterEncoding=utf8
      DB_USERNAME: ${DB_USERNAME:-yuelin}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-yuelin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      YUELIN_MESSAGING_ENABLED: "true"
      YUELIN_ADMIN_USER_IDS: ${YUELIN_ADMIN_USER_IDS:-}
      YUELIN_IMAGE_DIR: /app/data/images
      SECKILL_REQUEST_RATE_PER_SECOND: ${SECKILL_REQUEST_RATE_PER_SECOND:-1000}
      SECKILL_RECONCILE_INITIAL_DELAY_MS: ${SECKILL_RECONCILE_INITIAL_DELAY_MS:-30000}
      SECKILL_RECONCILE_INTERVAL_MS: ${SECKILL_RECONCILE_INTERVAL_MS:-30000}
      SECKILL_RECONCILE_TIMEOUT_MS: ${SECKILL_RECONCILE_TIMEOUT_MS:-60000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - image-data:/app/data/images
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - app
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  image-data:
