name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DB_PASSWORD: ci-${{ github.run_id }}-db
  MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-root
  RABBITMQ_PASSWORD: ci-${{ github.run_id }}-mq

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Repository secret and privacy hygiene
        run: npm run check:hygiene
      - name: Locked frontend dependencies and advisory check
        run: npm ci --no-audit --no-fund && npm audit --audit-level=high
      - name: Frontend static checks
        run: node scripts/frontend-static-check.mjs
      - name: Render test server regression
        run: node --test scripts/render-server.test.mjs
      - name: Unit tests
        run: mvn -B test
      - name: PMD
        run: mvn -B -DskipTests org.apache.maven.plugins:maven-pmd-plugin:3.26.0:check
      - name: SpotBugs
        run: mvn -B -DskipTests com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check
      - name: Package
        run: mvn -B -DskipTests package
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Build application image
        run: docker build -t yuelin-local-life:ci .
  integration-db:
    name: Database integration (real MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-root
          MYSQL_DATABASE: yuelin_local_life
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-${{ github.run_id }}-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run database integration tests
        env:
          INTEGRATION_DB: "true"
          INTEGRATION_DB_ALLOW_RESET: "true"
          DB_URL: "jdbc:mysql://127.0.0.1:3306/yuelin_local_life?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
          DB_USERNAME: root
          DB_PASSWORD: ci-${{ github.run_id }}-root
        run: mvn -B test -Dtest=DatabaseSchemaIT,ContentConsistencyIT -DfailIfNoTests=false

  frontend-render:
    name: Frontend render checks (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Playwright
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render checks
        run: node scripts/frontend-render-check.mjs

  compose-smoke:
    name: Full stack smoke (MySQL, Redis, RabbitMQ)
    runs-on: ubuntu-latest
    needs: [test-and-package, integration-db]
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: yuelin-ci-${{ github.run_id }}
      YUELIN_DISPOSABLE_ACCEPTANCE: "1"
      YUELIN_ADMIN_USER_IDS: "1"
      SECKILL_RECONCILE_INITIAL_DELAY_MS: "5000"
      SECKILL_RECONCILE_INTERVAL_MS: "1000"
      SECKILL_RECONCILE_TIMEOUT_MS: "5000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install locked browser dependencies
        run: npm ci --no-audit --no-fund
      - name: Install real acceptance browser
        run: npx playwright install --with-deps chromium
      - name: Full isolated acceptance (browser, MQ faults, load, restore)
        run: sh scripts/acceptance.sh
      - name: Capture stack logs
        if: always()
        run: |
          mkdir -p ci-artifacts
          docker compose ps -a > ci-artifacts/compose-status.txt
          docker compose logs --no-color 2>&1 | python3 scripts/redact-acceptance-logs.py > ci-artifacts/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-smoke-${{ github.run_id }}
          path: ci-artifacts/
          retention-days: 7
      - name: Remove disposable CI resources only
        if: always()
        run: docker compose down --volumes --remove-orphans
